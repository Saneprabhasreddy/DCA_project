services:
  mongo:
    image: mongo:7
    container_name: smartdca-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - smartdca-net

  backend:
    build: ./backend
    container_name: smartdca-backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - PORT=${BACKEND_PORT:-5000}
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts
    depends_on:
      - mongo
    networks:
      - smartdca-net

  frontend:
    build: ./frontend
    container_name: smartdca-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - smartdca-net

volumes:
  mongo_data:

networks:
  smartdca-net:
    driver: bridge
